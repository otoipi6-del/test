<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#0f0f1a">
    <title>Скоро запуск — Веб-приложение</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #8b5cf6;
            --success: #10b981;
            --bg: #0f0f1a;
            --card: rgba(255, 255, 255, 0.03);
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .gradient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, -2%); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 1;
            animation: orbFloat 12s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #06b6d4, var(--primary));
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, var(--accent), #ec4899);
            top: 40%;
            right: 10%;
            animation-delay: -8s;
            opacity: 0.25;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        .card {
            position: relative;
            z-index: 10;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 56px 48px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 24px 48px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            width: 72px;
            height: 72px;
            margin: 0 auto 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            animation: brandPulse 3s ease-in-out infinite;
        }

        @keyframes brandPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3); transform: scale(1); }
            50% { box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5); transform: scale(1.02); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 28px;
            animation: fadeIn 1s 0.3s both;
        }

        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            animation: fadeIn 1s 0.4s both;
        }

        p {
            color: var(--text-dim);
            font-size: 1.0625rem;
            line-height: 1.6;
            margin-bottom: 40px;
            animation: fadeIn 1s 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-wrap {
            margin-bottom: 40px;
            animation: fadeIn 1s 0.6s both;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8125rem;
            color: var(--text-dim);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 100px;
            animation: loadProgress 2.5s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes loadProgress {
            to { width: 72%; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            animation: fadeIn 1s 0.7s both;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 28px;
                border-radius: 20px;
            }
            h1 { font-size: 1.5rem; }
            p { font-size: 0.9375rem; }
            .features { gap: 10px; }
            .feature { font-size: 0.75rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid"></div>

    <div class="card">
        <div class="brand">🚀</div>
        
        <div class="badge">В разработке</div>
        
        <h1>Веб-приложение находится в&nbsp;разработке</h1>
        
        <p>
            Скоро здесь появится полноценный продукт. 
            Спасибо за терпение!
        </p>

        <div class="progress-wrap">
            <div class="progress-label">
                <span>Готовность</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="features">
            <span class="feature">⚡ Быстрый</span>
            <span class="feature">🔒 Безопасный</span>
            <span class="feature">📱 Адаптивный</span>
        </div>
    </div>

    <script>
        const percentEl = document.getElementById('percent');
        const target = 72;
        let current = 0;
        const duration = 2500;
        const startTime = performance.now() + 800;

        function updateCounter(now) {
            if (now < startTime) {
                requestAnimationFrame(updateCounter);
                return;
            }
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            current = Math.floor(eased * target);
            percentEl.textContent = current + '%';
            if (progress < 1) requestAnimationFrame(updateCounter);
        }
        requestAnimationFrame(updateCounter);
    </script>
</body>
</html>
